<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
            color: white;
        }

        .card {
            background: white;
            color: #333;
            padding: 35px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #6545bd;
        }

        button {
            background: #6545bd;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to My Website!</h1>
        <h2>Hello Everyone 👋</h2>
        <p>This is my first website created using HTML and CSS.</p>
        <button onclick="alert('Thank you for visiting!')">
            Click Me
        </button>
    </div>

</body>
</html>
